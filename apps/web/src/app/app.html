<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
@if (network.isOffline()) {
  <div
    role="status"
    data-testid="offline-banner"
    class="flex items-center justify-center gap-space-sm border-b border-borda bg-primaria px-space-lg py-space-sm text-label-md text-texto"
  >
    <span class="material-symbols-outlined text-body-lg" aria-hidden="true">wifi_off</span>
    <span>Você está offline. Visualizando dados salvos</span>
  </div>
}
@if (notice.message()) {
  <div role="alert" class="bg-perigo-fundo text-perigo p-space-md">
    {{ notice.message() }}
    <button type="button" (click)="notice.message.set('')" aria-label="Fechar aviso">×</button>
  </div>
}
<router-outlet />
