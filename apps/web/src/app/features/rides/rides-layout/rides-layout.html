<div
  class="flex min-h-screen flex-col bg-superficie font-sans text-texto [--rides-header-height:calc(var(--spacing-space-xl)+var(--spacing-space-lg)+var(--spacing-space-md)*2+1px)] [--rides-navigation-height:calc(var(--spacing-space-xl)*2+var(--spacing-space-lg)+1px)]"
>
  <header
    class="sticky top-0 z-40 border-b border-borda bg-superficie/95 px-space-lg py-space-md backdrop-blur max-lg:h-(--rides-header-height) max-lg:shrink-0"
  >
    <div class="mx-auto flex max-w-2xl items-center justify-between">
      <a routerLink="/rides" class="flex items-center gap-space-sm">
        <img src="/assets/logo.png" alt="" class="h-8 w-auto object-contain" />
        <span class="text-headline-sm text-texto">UTFRide</span>
      </a>
      <div class="flex items-center gap-space-md">
        <app-notification-bell
          [notifications]="notifications()"
          [loadError]="notificationsError()"
          (opened)="loadNotifications()"
        />
        <div
          role="img"
          data-testid="student-avatar"
          [attr.aria-label]="'Foto do aluno ' + studentName()"
          class="flex h-8 w-8 items-center justify-center rounded-full bg-primaria text-label-md text-texto"
        >
          {{ studentName() | initials }}
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-2xl flex-1 px-space-lg py-space-xl">
    <router-outlet />
  </main>

  <nav
    aria-label="Navegação principal"
    class="sticky bottom-0 z-40 h-(--rides-navigation-height) w-full shrink-0 border-t border-borda bg-superficie/95 backdrop-blur"
  >
    <div class="mx-auto flex h-full max-w-2xl items-center justify-around px-space-xs">
      <a
        routerLink="/rides"
        [attr.aria-current]="tripsLink.isActive ? null : 'page'"
        class="relative flex h-full min-w-16 flex-col items-center justify-center text-texto-suave hover:text-texto aria-[current=page]:text-texto after:absolute after:bottom-space-xs after:size-space-xs after:rounded-full aria-[current=page]:after:bg-primaria"
      >
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <span class="text-label-pill">Buscar</span>
      </a>
      <a
        routerLink="/driver/offer"
        class="flex h-full min-w-16 flex-col items-center justify-center text-texto-suave hover:text-texto"
      >
        <span class="material-symbols-outlined" aria-hidden="true">add_circle</span>
        <span class="text-label-pill">Oferecer</span>
      </a>
      <a
        routerLink="/driver/my-rides"
        class="flex h-full min-w-16 flex-col items-center justify-center text-texto-suave hover:text-texto"
      >
        <span class="material-symbols-outlined" aria-hidden="true">local_offer</span>
        <span class="text-label-pill">Ofertas</span>
      </a>
      <a
        routerLink="/rides/my-trips"
        routerLinkActive
        #tripsLink="routerLinkActive"
        ariaCurrentWhenActive="page"
        class="relative flex h-full min-w-16 flex-col items-center justify-center text-texto-suave hover:text-texto aria-[current=page]:text-texto after:absolute after:bottom-space-xs after:size-space-xs after:rounded-full aria-[current=page]:after:bg-primaria"
      >
        <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
        <span class="text-label-pill">Viagens</span>
      </a>
    </div>
  </nav>
</div>
